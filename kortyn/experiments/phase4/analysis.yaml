# Phase 4 evaluation (kortyn.phase4_steps), pre-registered in reports/phase4_preregistration.md, sections 5-7.
# The reuse check R0 failed (reports/phase4.md, deviations): every level inside the budget comes from phase 4;
# 1 500 and 2 000 ms are phase-3 values outside the smooth fit (tail rule), kept for the level table.
#   python -m kortyn.phase4_steps curves --config kortyn/experiments/phase4/analysis.yaml
#   python -m kortyn.phase4_steps retest --config kortyn/experiments/phase4/analysis.yaml
experiment: kortyn/experiments/phase3/libero_main.yaml   # episode layout: the task of every seed
bootstrap: 2000
seed: 4242
tolerance: 0.03
tick_ms: 50.0
fit_max_ms: 1250.0
zero_from_ms: 1500.0
gof_alpha: 0.01
without: ohne_rtc
with_rtc: mit_rtc
conditions:
  ohne_rtc:
    - {latency_ms: 0, run: results/phase4/libero/smolvla_libero/fest_0ms}
    - {latency_ms: 100, run: results/phase4/libero/smolvla_libero/fest_100ms}
    - {latency_ms: 200, run: results/phase4/libero/smolvla_libero/fest_200ms}
    - {latency_ms: 300, run: results/phase4/libero/smolvla_libero/fest_300ms}
    - {latency_ms: 500, run: results/phase4/libero/smolvla_libero/fest_500ms}
    - {latency_ms: 750, run: results/phase4/libero/smolvla_libero/fest_750ms}
    - {latency_ms: 1000, run: results/phase4/libero/smolvla_libero/fest_1000ms}
    - {latency_ms: 1250, run: results/phase4/libero/smolvla_libero/fest_1250ms}
    - {latency_ms: 1500, run: results/phase3/libero/smolvla_libero/fest_1500ms}
    - {latency_ms: 2000, run: results/phase3/libero/smolvla_libero/fest_2000ms}
  mit_rtc:
    - {latency_ms: 0, run: results/phase4/libero/smolvla_libero_rtc/rtc_0ms}
    - {latency_ms: 100, run: results/phase4/libero/smolvla_libero_rtc/rtc_100ms}
    - {latency_ms: 200, run: results/phase4/libero/smolvla_libero_rtc/rtc_200ms}
    - {latency_ms: 300, run: results/phase4/libero/smolvla_libero_rtc/rtc_300ms}
    - {latency_ms: 500, run: results/phase4/libero/smolvla_libero_rtc/rtc_500ms}
    - {latency_ms: 1000, run: results/phase4/libero/smolvla_libero_rtc/rtc_1000ms}
reference_sync: results/phase3/libero/smolvla_libero/sync25
retest:
  fleet: kortyn/experiments/phase3/fleet.yaml
  results_dir: results/phase3/validation
  informative: [a_n2, e_n2, e_n4]
  draws: 10000
output: results/phase4/curves.json
retest_output: results/phase4/retest.json
# Supplement (not pre-registered; reports/phase4.md): the phase-3 runs at the levels phase 4 measured again,
# pooled into the curve without RTC (python -m kortyn.phase4_steps sensitivity).
sensitivity_phase3:
  - {latency_ms: 0, run: results/phase3/libero/smolvla_libero/fest_0ms}
  - {latency_ms: 500, run: results/phase3/libero/smolvla_libero/fest_500ms}
  - {latency_ms: 1000, run: results/phase3/libero/smolvla_libero/fest_1000ms}
  - {latency_ms: 1250, run: results/phase3/libero/smolvla_libero/fest_1250ms}
sensitivity_output: results/phase4/sensitivity.json
# Supplement (not pre-registered): task 8 at 500 ms with every episode in a fresh process (libero_fresh.yaml),
# paired per seed with block A and phase 3 (python -m kortyn.phase4_steps fresh).
fresh:
  runs:
    - results/phase4/fresh/stream0/smolvla_libero/fest_500ms
    - results/phase4/fresh/stream1/smolvla_libero/fest_500ms
    - results/phase4/fresh/stream2/smolvla_libero/fest_500ms
    - results/phase4/fresh/stream3/smolvla_libero/fest_500ms
  compare:
    block_a: results/phase4/libero/smolvla_libero/fest_500ms
    phase3: results/phase3/libero/smolvla_libero/fest_500ms
  output: results/phase4/fresh.json
