# Phase 5, step 2, dose block D: RTC with short guidance at 200, 500 and 1 000 ms, 100 episodes per level
# (seeds 1000-1099: tasks 8 and 0 x init states 0-49), the same sample as the phase-4 curve without RTC
# (block A). Runs ONLY if the gate of block G passed (reports/phase5_preregistration.md, section 3); the 0-ms
# level of the curve is rtc_kurz_0ms of block G (seeds 1000-1099).
#   UV_PROJECT_ENVIRONMENT=.venv-libero uv run --no-sync \
#       python -m kortyn.run_virtual --config kortyn/experiments/phase5/libero_rtc_kurz_dose.yaml --share-model
extends: libero_rtc_kurz.yaml
experiment:
  episodes: 100
  suites:
    - profile: smolvla_libero_rtc
      runs:
        - {scenario: gut, timing: fest_200ms, strategy: rtc_kurz, image_transport: {codec: zstd, level: 9}, label: rtc_kurz_200ms}
        - {scenario: gut, timing: fest_500ms, strategy: rtc_kurz, image_transport: {codec: zstd, level: 9}, label: rtc_kurz_500ms}
        - {scenario: gut, timing: fest_1000ms, strategy: rtc_kurz, image_transport: {codec: zstd, level: 9}, label: rtc_kurz_1000ms}
