# Phase 3 economics: every price and figure below is an ASSUMPTION with source and date (accessed 2026-10-25
# unless stated). All amounts are NET (excl. VAT): a company deducts input VAT; new prices incl. 19 % VAT
# are divided by 1.19, private used-market prices carry no VAT, electricity is quoted net. 2026 context: a memory shortage pushed GPU street prices to 1.4-3.5x list price, and NVIDIA
# raised Jetson prices by up to 101 % in July 2026 (CNX Software, 22 Jul 2026). Read by kortyn.economics.
